name: odoo-revolut-dev

services:
  db:
    image: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: odoo
      POSTGRES_USER: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  odoo:
    build:
      context: .
      dockerfile: docker/odoo-test.Dockerfile
      args:
        ODOO_BASE_IMAGE: ${ODOO_REVOLUT_BASE_IMAGE:-odoo:18.0-20261015@sha256:1b346c6f9145c79b802b711a554a141acbd0503ed6cd7d31cb3c938889c4cc36}
    image: ${ODOO_REVOLUT_TEST_IMAGE:-odoo-revolut-test:18.0.20261015-chrome153}
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PASSWORD: odoo
      USER: odoo
      ODOO_REVOLUT_SECRET_TEST_TERMINAL: test-only-not-a-credential
      ODOO_REVOLUT_BLOCK_MERCHANT_HTTP: "1"
    volumes:
      - ${ODOO_REVOLUT_ADDONS_DIR:-.}:/mnt/extra-addons:ro
      - odoo-test-data:/var/lib/odoo

networks:
  default:
    internal: true

volumes:
  odoo-test-data:
